name: update-steam-free

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Steam free promotions
        run: python3 scripts/fetch_steam_free.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/steam-free.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "chore: update steam free list"
            git push
          fi
